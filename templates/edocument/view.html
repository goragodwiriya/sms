<!-- modal รายละเอียดหนังสือ เปิดจาก row action "detail" ของหนังสือรับ (api/edocument/inbox/action) -->
<article class="edocument-view">
  <dl class="detail-list">
    <dt class="icon-number" data-i18n>{LNG_Document No.}</dt>
    <dd data-text="document_no"></dd>
    <dt class="icon-clock" data-i18n>{LNG_Urgency}</dt>
    <dd><span class="edocument-urgency" data-class="'urgency-' + urgency" data-text="urgency_text"></span></dd>
    <dt class="icon-edocument" data-i18n>{LNG_Document title}</dt>
    <dd data-text="topic" translate="no"></dd>
    <dt class="icon-customer" data-i18n>{LNG_Sender}</dt>
    <dd data-text="sender" translate="no"></dd>
    <dt class="icon-calendar" data-i18n>{LNG_Date}</dt>
    <dd data-text="date | datetime"></dd>
    <dt class="icon-file" data-i18n>{LNG_Size of} {LNG_File}</dt>
    <dd data-text="size | bytes"></dd>
    <dt class="icon-edit" data-i18n>{LNG_Detail}</dt>
    <dd class="edocument-detail" data-text="detail" translate="no"></dd>
    <dt class="icon-star0" data-i18n>{LNG_Status}</dt>
    <dd>
      <span class="icon-email edocument-new" data-if="is_new" data-i18n>{LNG_New}</span>
      <span class="icon-valid edocument-received" data-if="!is_new" data-i18n>{LNG_Received}</span>
    </dd>
  </dl>
  <!-- ดาวน์โหลด = ลงชื่อรับหนังสือ (api/edocument/view/download บันทึกการรับแล้วส่งไฟล์) -->
  <form data-form="edocumentDownload" action="api/edocument/view/download" method="post" data-ajax-submit="true">
    <fieldset class="submit">
      <button type="submit" class="btn btn-primary large icon-download" data-i18n>{LNG_Download}</button>
      <input type="hidden" name="id" data-attr="value:id">
    </fieldset>
  </form>
</article>
